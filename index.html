<style>
  :root{
    --gold:#a3822f; --gold-2:#c9a94f;
    --bg:#0c1224; --text:#f5f6f8; --dim:#7f8ab0; --idle:#4a5478;
    --warn:#e8a33d; --danger:#ff4136;
    --perf-bg:rgba(63,191,106,.18); --perf-text:#3fbf6a;
    --chg-bg:rgba(163,130,47,.28); --chg-text:#e8c877;
    --man-bg:rgba(154,164,189,.2); --man-text:#c3cadf;
  }
  html[data-theme="light"]{
    --bg:#ffffff; --text:#10152b; --dim:#5b6480; --idle:#8890a8;
    --warn:#a35d00; --danger:#c81e1e;
    --perf-bg:rgba(31,138,72,.14); --perf-text:#1f8a48;
    --chg-bg:rgba(163,130,47,.20); --chg-text:#8a6d1f;
    --man-bg:rgba(90,98,128,.14); --man-text:#4a5170;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    overflow:hidden;transition:background .2s ease,color .2s ease;}
  #stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--bg);transition:background-color .15s ease;
    padding:110px 14px 52px;overflow:hidden;}
  #logoCorner{position:fixed;top:22px;left:26px;background:#0b0e1a;border-radius:10px;padding:10px 15px;box-shadow:0 2px 10px rgba(0,0,0,.3);}
  #logoCorner img{height:30px;display:block;}
  #clock{position:fixed;top:26px;right:90px;font-family:'SF Mono','Consolas','Roboto Mono',monospace;font-size:26px;font-weight:600;color:var(--gold-2);letter-spacing:1px;font-variant-numeric:tabular-nums;}
  #themeToggle{position:fixed;top:22px;right:26px;width:40px;height:40px;border-radius:10px;border:1px solid rgba(128,128,128,.3);
    background:rgba(128,128,128,.12);color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  #themeToggle:hover{background:rgba(128,128,128,.22);}
  #connDot{position:fixed;bottom:20px;right:26px;display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim);letter-spacing:.5px;text-transform:uppercase;}
  #connDot .dot{width:8px;height:8px;border-radius:50%;background:#666;}
  #connDot.live .dot{background:#3fbf6a;box-shadow:0 0 6px #3fbf6a;}
  #connDot.stale .dot{background:var(--warn);}
  #connDot.error .dot{background:var(--danger);}
  #showLabel{position:fixed;top:80px;left:50%;transform:translateX(-50%);color:var(--dim);font-size:15px;letter-spacing:3px;text-transform:uppercase;font-weight:600;
    max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;}
  #badge{font-size:20px;font-weight:700;letter-spacing:3px;text-transform:uppercase;padding:7px 20px;border-radius:28px;margin-bottom:16px;display:none;}
  .b-performance{background:var(--perf-bg);color:var(--perf-text);}
  .b-changeover{background:var(--chg-bg);color:var(--chg-text);}
  .b-manual{background:var(--man-bg);color:var(--man-text);}
  #actName{font-size:52px;font-weight:700;color:var(--text);margin-bottom:26px;text-align:center;padding:0 60px;max-width:90vw;display:none;}
  #countdown{font-family:'SF Mono','Consolas','Roboto Mono',monospace;font-size:min(24vw,280px);font-weight:700;letter-spacing:5px;
    color:var(--text);line-height:1;font-variant-numeric:tabular-nums;}
  #countdown.warn{color:var(--warn);}
  #countdown.danger{color:#fff;}
  #overrunTag{margin-top:8px;font-size:20px;font-weight:700;letter-spacing:4px;color:#fff;text-transform:uppercase;opacity:0;}
  #overrunTag.show{opacity:1;}

  /* Compact mode: a short viewport (a phone rotated to landscape) doesn't have
     room for the normal spacing between the show name, badge, act name and
     countdown, so this tightens things up rather than letting them collide or
     run off-screen. Toggled by JS based on window height, not a fixed breakpoint. */
  #stage.compact{padding:76px 14px 34px;}
  #stage.compact #showLabel{top:50px;font-size:11px;}
  #stage.compact #badge{font-size:13px;padding:4px 12px;margin-bottom:6px;}
  #stage.compact #actName{margin-bottom:8px;}
  #stage.compact #overrunTag{margin-top:4px;font-size:14px;}
  @keyframes flashRed{0%,100%{background-color:#000000;}50%{background-color:#ff1a1a;}}
  #stage.alarm{animation:flashRed .9s steps(2,jump-none) infinite;}
  #stage.alarm #actName,#stage.alarm #countdown,#stage.alarm #showLabel,
  #stage.alarm #messageText,#stage.alarm #messageSubTime,#stage.alarm #messageSubTimeLabel{color:#fff !important;text-shadow:0 2px 6px rgba(0,0,0,.6);}
  #idleMsg{color:var(--idle);font-size:20px;letter-spacing:2px;text-transform:uppercase;}
  #messageOverlay{display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 60px;}
  #messageText{font-size:min(8.5vw,110px);font-weight:800;color:var(--text);text-align:center;max-width:90vw;line-height:1.15;word-wrap:break-word;}
  #messageSubTimeWrap{display:none;flex-direction:column;align-items:center;gap:5px;padding-top:5px;border-top:2px solid rgba(128,128,128,.25);}
  #messageSubTimeLabel{font-size:12px;letter-spacing:4px;color:var(--dim);font-weight:700;text-transform:uppercase;}
  #messageSubTime{font-family:'SF Mono','Consolas','Roboto Mono',monospace;font-size:min(5.5vw,78px);font-weight:700;letter-spacing:2px;color:var(--text);font-variant-numeric:tabular-nums;opacity:.92;}
  #messageSubTime.warn{color:var(--warn);}
  #messageSubTime.danger{color:var(--danger);}

  #setupWrap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--bg);padding:20px;}
  #setupCard{background:rgba(128,128,128,.08);border:1px solid rgba(128,128,128,.25);border-radius:12px;padding:28px 30px;max-width:420px;width:100%;}
  #setupCard h2{margin:0 0 6px;font-size:16px;color:var(--text);}
  #setupCard p{margin:0 0 18px;font-size:12.5px;color:var(--dim);line-height:1.5;}
  #setupCard label{display:block;font-size:11px;color:var(--dim);font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
  #setupCard input{width:100%;background:rgba(0,0,0,.2);border:1px solid rgba(128,128,128,.3);color:var(--text);
    border-radius:6px;padding:9px 10px;font-size:13px;margin-bottom:14px;}
  #setupCard button{width:100%;background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#1a1206;border:none;
    border-radius:8px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;}
</style>
</head>

  <div id="clock">--:--:--</div>
  <button id="themeToggle" title="Switch day/night display">&#9728;</button>
  <div id="showLabel"></div>
  <div id="badge" class="b-manual">Manual</div>
  <div id="actName"></div>
  <div id="countdown">00:00:00</div>
  <div id="overrunTag">OVERRUN</div>
  <div id="idleMsg">Waiting for broadcast&hellip;</div>
  <div id="messageOverlay">
    <div id="messageText"></div>
    <div id="messageSubTimeWrap"><div id="messageSubTimeLabel">Time Remaining</div><div id="messageSubTime">00:00:00</div></div>
  </div>
  <div id="connDot"><span class="dot"></span><span id="connText">Connecting</span></div>
</div>

<div id="setupWrap">
  <div id="setupCard">
    <h2>Connect to a broadcast</h2>
    <p>Ask whoever sent you this page for the link — it should already include these details. If not, paste them in below (you only need to do this once on this device).</p>
    <label>Firebase Realtime Database URL</label>
    <input type="text" id="setupDbUrl" placeholder="https://your-project-default-rtdb.firebaseio.com">
    <label>Room ID</label>
    <input type="text" id="setupRoomId" placeholder="show-abc123">
    <button id="setupSaveBtn">Connect</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  function pad(n){ return String(n).padStart(2,'0'); }
  function fmt(totalSeconds){
    var neg = totalSeconds < 0;
    var s = Math.abs(Math.round(totalSeconds));
    var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
    return (neg?'-':'') + pad(h)+':'+pad(m)+':'+pad(sec);
  }
  function nowClockStr(){
    var d = new Date();
    return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  }
  function loadJSON(key, fallback){
    try{ var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }catch(e){ return fallback; }
  }
  function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

  var el = {
    stage: document.getElementById('stage'),
    logoCorner: document.getElementById('logoCorner'),
    clock: document.getElementById('clock'),
    themeToggle: document.getElementById('themeToggle'),
    showLabel: document.getElementById('showLabel'),
    badge: document.getElementById('badge'),
    actName: document.getElementById('actName'),
    countdown: document.getElementById('countdown'),
    overrunTag: document.getElementById('overrunTag'),
    idleMsg: document.getElementById('idleMsg'),
    messageOverlay: document.getElementById('messageOverlay'),
    messageText: document.getElementById('messageText'),
    messageSubTimeWrap: document.getElementById('messageSubTimeWrap'),
    messageSubTime: document.getElementById('messageSubTime'),
    connDot: document.getElementById('connDot'),
    connText: document.getElementById('connText'),
    setupWrap: document.getElementById('setupWrap'),
    setupDbUrl: document.getElementById('setupDbUrl'),
    setupRoomId: document.getElementById('setupRoomId'),
    setupSaveBtn: document.getElementById('setupSaveBtn')
  };

  /* ---- theme ---- */
  var theme = loadJSON('sm_viewer_theme', 'dark');
  function applyTheme(){
    document.documentElement.setAttribute('data-theme', theme);
    el.themeToggle.innerHTML = theme === 'light' ? '&#127769;' : '&#9728;';
  }
  el.themeToggle.addEventListener('click', function(){
    theme = theme === 'light' ? 'dark' : 'light';
    saveJSON('sm_viewer_theme', theme);
    applyTheme();
  });
  applyTheme();

  /* ---- connection settings: URL query params win, else localStorage ----
     Two link shapes:
     - ?blob=<url>        -- auto mode: a single ready-made JSON store URL
     - ?db=<url>&room=<id> -- advanced mode: the sender's own Firebase project */
  var qs = new URLSearchParams(location.search);
  var blobUrl = qs.get('blob') || loadJSON('sm_viewer_blobUrl', '');
  var dbUrl = qs.get('db') || loadJSON('sm_viewer_dbUrl', '');
  var roomId = qs.get('room') || loadJSON('sm_viewer_roomId', '');

  function haveSettings(){ return !!blobUrl || !!(dbUrl && roomId); }
  function fetchTargetUrl(){
    if(blobUrl) return blobUrl;
    return dbUrl.replace(/\/+$/,'') + '/broadcasts/' + encodeURIComponent(roomId) + '.json';
  }

  el.setupSaveBtn.addEventListener('click', function(){
    var u = el.setupDbUrl.value.trim(), r = el.setupRoomId.value.trim();
    if(!u || !r){ alert('Enter both the database URL and room ID.'); return; }
    blobUrl = '';
    dbUrl = u; roomId = r;
    saveJSON('sm_viewer_blobUrl', '');
    saveJSON('sm_viewer_dbUrl', dbUrl);
    saveJSON('sm_viewer_roomId', roomId);
    el.setupWrap.style.display = 'none';
    startPolling();
  });

  if(!haveSettings()){
    el.setupWrap.style.display = 'flex';
  } else {
    saveJSON('sm_viewer_blobUrl', blobUrl);
    saveJSON('sm_viewer_dbUrl', dbUrl);
    saveJSON('sm_viewer_roomId', roomId);
  }

  /* ---- clock ---- */
  setInterval(function(){ el.clock.textContent = nowClockStr(); }, 1000);
  el.clock.textContent = nowClockStr();

  /* ---- state from broadcast ---- */
  var lastPayload = null;
  var lastFetchClientTime = 0;
  var lastGoodFetchTime = 0;
  var pollTimer = null, tickTimer = null;

  function setConn(state, text){
    el.connDot.className = state;
    el.connText.textContent = text;
  }

  function poll(){
    if(!haveSettings()) return;
    var url = fetchTargetUrl();
    fetch(url, { cache: 'no-store' }).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(data){
      lastFetchClientTime = Date.now();
      lastGoodFetchTime = lastFetchClientTime;
      if(data){
        lastPayload = data;
        setConn('live', 'Live');
      } else {
        lastPayload = null;
        setConn('live', 'Waiting for cue');
      }
    }).catch(function(){
      setConn('error', 'Connection error');
    });
  }

  function currentRemaining(){
    if(!lastPayload) return 0;
    if(!lastPayload.running) return lastPayload.remaining;
    var elapsed = (Date.now() - lastFetchClientTime) / 1000;
    return lastPayload.remaining - elapsed;
  }

  function isFreeRunUp(){ return !!lastPayload && lastPayload.countMode === 'up'; }
  function displaySeconds(r){ return isFreeRunUp() ? Math.abs(r) : r; }

  /* Shrinks an element's font-size only if its text is actually too big for the
     screen — either too wide (a narrow phone in portrait) or too tall for the
     space available (a short phone in landscape) — without changing how it looks
     on a normal wide display/TV where it already fits at its CSS size.
     maxHeightRatio is optional: fraction of the window height this element is
     allowed to take up (omit to only guard against width overflow). */
  function fitOverflow(elm, maxHeightRatio){
    if(!elm) return;
    elm.style.fontSize = '';
    if(getComputedStyle(elm).display === 'none') return;
    var parent = elm.parentElement || document.body;
    var availW = (parent.clientWidth || window.innerWidth) * 0.94;
    var availH = maxHeightRatio ? window.innerHeight * maxHeightRatio : Infinity;
    var natural = elm.scrollWidth;
    var naturalH = elm.scrollHeight;
    var current = parseFloat(getComputedStyle(elm).fontSize) || 100;
    var scale = 1;
    if(natural > availW && natural > 0) scale = Math.min(scale, availW / natural);
    if(naturalH > availH && naturalH > 0) scale = Math.min(scale, availH / naturalH);
    if(scale < 1){
      elm.style.fontSize = Math.max(16, Math.floor(current * scale)) + 'px';
    }
  }

  // A short viewport (phone in landscape) doesn't have room for the normal
  // spacing between the header row, show name, badge, act name and countdown —
  // this tightens that spacing instead of letting elements collide.
  function updateCompactMode(){
    el.stage.classList.toggle('compact', window.innerHeight < 480);
  }

  /* ---------------- custom cue types (mirrors control-panel logic) ---------------- */
  function isCustomType(type){ return !!type && type !== 'performance' && type !== 'changeover' && type !== 'manual'; }
  function hexToRgba(hex, a){
    var h = (hex || '#8890a8').replace('#','');
    var r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
    return 'rgba('+r+','+g+','+b+','+a+')';
  }
  function applyKindStyle(elm, color){
    elm.style.background = hexToRgba(color, 0.22);
    elm.style.color = color;
    elm.style.border = '1px solid ' + hexToRgba(color, 0.45);
  }
  function clearKindStyle(elm){
    elm.style.background = '';
    elm.style.color = '';
    elm.style.border = '';
  }

  function render(){
    if(!haveSettings()) return;
    updateCompactMode();

    // staleness check
    if(lastGoodFetchTime){
      var age = (Date.now() - lastGoodFetchTime) / 1000;
      if(age > 8 && el.connDot.className !== 'error'){ setConn('stale', 'Reconnecting'); }
    }

    if(!lastPayload){
      el.idleMsg.style.display = 'block';
      el.badge.style.display = 'none';
      el.actName.style.display = 'none';
      el.countdown.style.display = 'none';
      el.overrunTag.classList.remove('show');
      el.messageOverlay.style.display = 'none';
      el.stage.classList.remove('alarm');
      el.showLabel.textContent = '';
      return;
    }

    el.showLabel.textContent = lastPayload.showName || '';

    var remaining = currentRemaining();
    var armed = !!lastPayload.armed;

    if(lastPayload.messageMode){
      el.idleMsg.style.display = 'none';
      el.badge.style.display = 'none';
      el.actName.style.display = 'none';
      el.countdown.style.display = 'none';
      el.overrunTag.classList.remove('show');
      el.messageOverlay.style.display = 'flex';
      el.messageText.textContent = lastPayload.message || '';
      el.stage.classList.toggle('alarm', !!lastPayload.messageFlashing);
      fitOverflow(el.messageText, 0.4);

      if(armed){
        el.messageSubTimeWrap.style.display = 'flex';
        el.messageSubTime.classList.remove('warn','danger');
        if(!isFreeRunUp()){
          if(remaining <= 0){ el.messageSubTime.classList.add('danger'); }
          else if(remaining <= 60){ el.messageSubTime.classList.add('warn'); }
        }
        el.messageSubTime.textContent = fmt(displaySeconds(remaining));
        fitOverflow(el.messageSubTime, 0.14);
      } else {
        el.messageSubTimeWrap.style.display = 'none';
      }
      return;
    }

    el.messageOverlay.style.display = 'none';
    el.countdown.style.display = 'block';

    var hasCurrent = !!(lastPayload.actName);
    if(hasCurrent){
      el.badge.style.display = 'inline-block';
      el.actName.style.display = 'block';
      el.idleMsg.style.display = 'none';
      var type = lastPayload.cueType || 'manual';
      if(isCustomType(type)){
        el.badge.className = '';
        clearKindStyle(el.badge);
        applyKindStyle(el.badge, lastPayload.cueTypeColor || '#8890a8');
        el.badge.textContent = lastPayload.cueTypeLabel || 'Custom';
      } else {
        clearKindStyle(el.badge);
        el.badge.className = 'b-' + type;
        el.badge.textContent = type === 'changeover' ? 'Changeover' : (type === 'performance' ? 'Performance' : 'Manual');
      }
      el.actName.textContent = lastPayload.actName;
      fitOverflow(el.actName, 0.16);
    } else {
      el.badge.style.display = 'none';
      el.actName.style.display = 'none';
      el.idleMsg.style.display = armed ? 'none' : 'block';
    }

    el.countdown.classList.remove('warn','danger');
    if(!armed){
      el.stage.classList.remove('alarm');
      el.overrunTag.classList.remove('show');
      el.countdown.textContent = fmt(0);
      el.countdown.style.display = hasCurrent ? 'block' : 'none';
    } else if(isFreeRunUp()){
      el.stage.classList.remove('alarm');
      el.overrunTag.classList.remove('show');
      el.countdown.textContent = fmt(displaySeconds(remaining));
    } else if(remaining <= 0){
      el.countdown.classList.add('danger');
      el.stage.classList.add('alarm');
      el.overrunTag.classList.add('show');
      el.overrunTag.textContent = remaining < -0.5 ? ('OVER BY ' + fmt(Math.abs(remaining))) : "TIME'S UP";
      el.countdown.textContent = fmt(remaining);
    } else {
      el.stage.classList.remove('alarm');
      el.overrunTag.classList.remove('show');
      if(remaining <= 60) el.countdown.classList.add('warn');
      el.countdown.textContent = fmt(remaining);
    }
    fitOverflow(el.countdown, hasCurrent ? 0.32 : 0.42);
  }

  // Re-fit text immediately on rotation/resize instead of waiting for the next
  // 1-second tick, so turning the phone doesn't leave it overflowing briefly.
  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 60);
  });
  window.addEventListener('orientationchange', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 60);
  });

  function startPolling(){
    if(pollTimer) clearInterval(pollTimer);
    if(tickTimer) clearInterval(tickTimer);
    poll();
    pollTimer = setInterval(poll, 2000);
    tickTimer = setInterval(render, 1000);
    startHeartbeat();
  }

  /* ---- presence heartbeat: lets the sender's control page show a live
     viewer count. Only supported for the "advanced" Firebase backend (?db=&room=) —
     the free "auto" (?blob=) backend is a single shared document with no safe way
     for many viewers to register themselves without overwriting one another. ---- */
  var viewerId = 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  var heartbeatTimer = null;
  function sendHeartbeat(){
    if(blobUrl || !dbUrl || !roomId) return;
    var url = dbUrl.replace(/\/+$/, '') + '/broadcasts/' + encodeURIComponent(roomId) + '/viewers/' + viewerId + '.json';
    fetch(url, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lastSeen: Date.now() })
    }).catch(function(){});
  }
  function startHeartbeat(){
    if(blobUrl || !dbUrl || !roomId) return;
    if(heartbeatTimer) clearInterval(heartbeatTimer);
    sendHeartbeat();
    heartbeatTimer = setInterval(sendHeartbeat, 10000);
  }

  if(haveSettings()) startPolling();
})();
</script>
</body>
</html>
